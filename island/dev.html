<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marcus Wong · Island</title>
<meta name="description" content="An explorable 3D island of Marcus Wong's projects, writing, and approach.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="splash">
  <div class="dot"></div>
  <h1>Marcus <span class="accent">Wong</span></h1>
  <div class="tagline">I build AI products that close the gap between capability and adoption. Come explore the island.</div>
  <div class="press">Click to explore</div>
  <div class="controls"><b>WASD / ↑↓←→</b> walk &nbsp;·&nbsp; <b>E</b> read &amp; talk &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; drag to look around &nbsp;·&nbsp; <b>M</b> music</div>
</div>

<a id="hud-home" href="/">← Back to site</a>
<button id="hud-mute">🔊</button>
<div id="hud-hint"></div>

<div id="dialog">
  <div class="name"></div>
  <div class="bubble">
    <div class="text"></div>
    <div class="foot">
      <div class="actions"></div>
      <div class="pager"></div>
      <div class="more">▼</div>
    </div>
  </div>
</div>

<div id="directory">
  <div class="panel">
    <div class="head">
      <div><h2></h2><div class="sub"></div></div>
      <button></button>
    </div>
    <div class="list"></div>
  </div>
</div>

<div id="joy"><div class="base"></div><div class="stick"></div></div>
<button id="btn-act">E</button>
<div id="devhud"></div>

<script src="three.min.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="island.js"></script>
</body>
</html>
